[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "food-decision-backend"
version = "0.1.0"
description = "FastAPI backend for the Food Decision student project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.12,<0.116",
  "httpx>=0.27,<0.29",
  "pandas>=2.2,<3.0",
  "uvicorn[standard]>=0.32,<0.35",
  "Pillow>=10,<13",
  "pyvi>=0.1.1,<0.2",
  "pytesseract>=0.3.10,<0.4",
  "python-multipart>=0.0.9,<1",
  "scikit-learn>=1.5,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.features.restaurant_discovery" = ["data/*.json"]
"app.data" = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
