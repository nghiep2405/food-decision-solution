    <style>
      .debug-panel {
        position: fixed;
        bottom: 12px;
        right: 12px;
        max-width: calc(100vw - 24px);
        background: #fff;
        padding: 10px 12px;
        border-radius: 10px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.16);
        z-index: 9999;
        font-family: system-ui, -apple-system, sans-serif;
        border: 1px solid #d6d0c4;
      }
      .debug-panel summary {
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        user-select: none;
      }
      .debug-panel__group {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .debug-panel button {
        padding: 6px 10px;
        font-size: 12px;
        border: 1px solid #cbc5b6;
        border-radius: 6px;
        background: #fffdf7;
        cursor: pointer;
      }
      .debug-panel button.is-active {
        background: #18392b;
        color: #fffdf7;
        border-color: #18392b;
      }
      .debug-panel hr {
        margin: 8px 0 0;
        border: none;
        border-top: 1px solid #ece7db;
      }
    </style>
  </head>

    <div id="wp5-demo-root"></div>

    <!-- Thanh Debug thu gọn được để không chắn viewport 320px -->
    <details class="debug-panel" open>
      <summary>Debug Controls (FINAL-04)</summary>
      <div class="debug-panel__group">
        <button type="button" data-scenario="normal" class="is-active">Bình thường</button>
        <button type="button" data-scenario="suspicious">Đáng ngờ (Spam/Burst)</button>
        <button type="button" data-scenario="conflict">Mâu thuẫn &amp; Null rating</button>
        <button type="button" data-scenario="insufficient">Thiếu bằng chứng</button>
        <button type="button" data-scenario="empty">Rỗng (0 review)</button>
      </div>
      <hr />
      <div class="debug-panel__group">
        <button type="button" data-state="loading">State: Loading</button>
        <button type="button" data-state="error">State: Error</button>
      </div>
    </details>

      const root = document.getElementById('wp5-demo-root');
      const shell = createAppShell(root);
      shell.setBackAction({ visible: false });

      let activeScenarioKey = 'normal';
      let feature = null;
      let retryTimerId = null;

      function clearRetryTimer() {
        if (retryTimerId !== null) {
          clearTimeout(retryTimerId);
          retryTimerId = null;
        }
      }

      function setActiveButton(selector) {
        document.querySelectorAll('.debug-panel button').forEach((btn) => {
          btn.classList.toggle('is-active', btn.matches(selector));
        });
      }

      function mountScenario(key) {
        clearRetryTimer();
        activeScenarioKey = key;
        const scenario = DEMO_SCENARIOS[key];
        if (feature) {
          feature.unmount();
        }
        feature = mountReviewReliability(shell.main, {
          restaurant: scenario.restaurant,
          overviewData: scenario.overview,
        });
        setActiveButton(`button[data-scenario="${key}"]`);
      }

      mountScenario('normal');

      document.querySelectorAll('button[data-scenario]').forEach((btn) => {
        btn.addEventListener('click', () => {
          mountScenario(btn.dataset.scenario);
        });
      });

      document.querySelectorAll('button[data-state]').forEach((btn) => {
        btn.addEventListener('click', () => {
          clearRetryTimer();
          feature?.setViewState(btn.dataset.state);
          setActiveButton(`button[data-state="${btn.dataset.state}"]`);
        });
      });

      root.addEventListener('review:retry-analysis', () => {
        clearRetryTimer();
        shell.showToast('Đang gọi lại dữ liệu tổng quan...', 'info');
        retryTimerId = setTimeout(() => {
          retryTimerId = null;
          const scenario = DEMO_SCENARIOS[activeScenarioKey];
          feature?.setOverviewData(scenario.overview);
          setActiveButton(`button[data-scenario="${activeScenarioKey}"]`);
          shell.showToast('Tải lại thành công.', 'success');
        }, 1000);
      });

  </body>
</html>
