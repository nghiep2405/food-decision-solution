<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WP5 Review Reliability Demo | Food Decision</title>
  </head>
  <body>
    <div id="wp5-demo-root"></div>
    <script type="module">
      import './src/styles/global.css';
      import { createAppShell } from './src/core/ui/app-shell.js';
      import { mountReviewReliability } from './src/features/review-reliability/index.js';

      const root = document.getElementById('wp5-demo-root');
      const shell = createAppShell(root);
      shell.setBackAction({ visible: false });

      mountReviewReliability(shell.main, {
        restaurant: {
          id: 'review-demo-restaurant',
          name: 'Quán ăn mẫu - Review Reliability',
        },
        initialScenario: 'normal',
        onOpenFeedback() {
          shell.showToast('Đã tạo điểm bàn giao sang feature Feedback.', 'info');
        },
      });
    </script>
  </body>
</html>
